# Astana Walk
#   docker compose up -d --build                  app on http://127.0.0.1:8090 (APP_PORT)
#   docker compose --profile test run --rm tests  backend + collector unit tests
#   docker compose --profile test run --rm e2e    browser journeys + axe accessibility
#   docker compose --profile dev up web           Vite dev server with hot reload on :5180 (WEB_PORT)
#   docker compose --profile data run --rm ...    data collection / Gemini extraction (see README)

x-env: &env
  env_file:
    - path: .env
      required: false

services:
  app:
    build:
      context: .
      target: app
    image: astana-walk:latest
    <<: *env
    ports:
      # APP_HOST=0.0.0.0 opens the app to phones on the same Wi-Fi (http://<computer-ip>:8090).
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8090}:8000"
    restart: unless-stopped
    networks:
      default:
        # Browsers force HTTPS for the bare host "app" (.app is an HSTS-preloaded TLD),
        # so containers reach the service by this alias instead.
        aliases: [astana-walk]

  # --- tests -----------------------------------------------------------------
  tests:
    profiles: ["test"]
    build:
      context: .
      target: dev
    image: astana-walk-dev:latest
    # Unit tests mock the model; an empty key keeps them independent of the local .env.
    environment:
      GEMINI_API_KEY: ""
      LLM_PROVIDER: offline
    command: ["python", "-m", "pytest", "tests", "-q"]

  collector-tests:
    profiles: ["test"]
    build:
      context: .
      target: collector
    image: astana-walk-collector:latest

  e2e:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /e2e/frontend
    environment:
      BASE_URL: http://astana-walk:8000
      PW_CHANNEL: chromium
      CI: "1"
      # 1 = also refresh the qa/*.png screenshots; off by default so test runs leave git clean.
      QA_SCREENSHOTS: ${QA_SCREENSHOTS:-0}
    volumes:
      - ./frontend:/e2e/frontend
      - e2e_node_modules:/e2e/frontend/node_modules
      - ./qa:/e2e/qa
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    depends_on:
      app:
        condition: service_healthy

  # --- development -----------------------------------------------------------
  web:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /web
    environment:
      API_PROXY: http://astana-walk:8000
    volumes:
      - ./frontend:/web
      - web_node_modules:/web/node_modules
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:5173"
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"]
    depends_on:
      app:
        condition: service_healthy

  # --- data pipeline ---------------------------------------------------------
  # First page of public 2GIS reviews -> collector/output/reviews_2gis (local only, git-ignored).
  reviews:
    profiles: ["data"]
    image: astana-walk-collector:latest
    build:
      context: .
      target: collector
    volumes:
      - ./data:/app/data:ro
      - ./collector/output:/app/collector/output
    command: ["-m", "scripts.collect_reviews"]

  # Gemini claim extraction -> data/review_signals.jsonl (needs GEMINI_API_KEY in .env).
  signals:
    profiles: ["data"]
    image: astana-walk-dev:latest
    build:
      context: .
      target: dev
    <<: *env
    volumes:
      - ./data:/app/data
      - ./collector/output:/app/collector/output
    command: ["python", "scripts/extract_review_signals.py"]

volumes:
  e2e_node_modules:
  web_node_modules:
