<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#14161b" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2300B8D9'/%3E%3Cpath d='M23 14c0 5-7 11-7 11s-7-6-7-11a7 7 0 0 1 14 0Z' fill='none' stroke='%23071318' stroke-width='2.6' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='14' r='2.6' fill='%23071318'/%3E%3C/svg%3E"
    />
    <title>Astana Walk — прогулки по городу</title>
    <script>
      // Apply the saved theme and language before first paint (no light flash in dark mode).
      (function () {
        try {
          var t = localStorage.getItem("uiTheme");
          if (t !== "light") t = "dark";
          document.documentElement.setAttribute("data-theme", t);
          var l = localStorage.getItem("lang");
          document.documentElement.setAttribute("lang", l === "kk" || l === "en" ? l : "ru");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
